app:
  github-token: ${GITHUB_TOKEN}
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}
  scheduler:
    threads: 1
  bot-url: http://localhost:8080
  access-type: SQL
  batch-size: 50
  message-transport: kafka


spring:
  application:
    name: Scrapper
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: http://localhost:9092
    topic: notifications
    consumer:
      auto-offset-reset: earliest
      group-id: first
  redis:
    host: localhost
    port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false



test:
  topic: test

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
