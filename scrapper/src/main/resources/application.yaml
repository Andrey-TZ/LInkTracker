app:
  github-token: ${GITHUB_TOKEN}
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}
  scheduler:
    threads: 5
  bot-url: http://localhost:8080
  access-type: ORM
  batch-size: 50

spring:
  application:
    name: Scrapper
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
